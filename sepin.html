<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wheel of Destiny - Roda Putar dengan Suara</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Inter', sans-serif;
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .app-container {
            max-width: 1400px;
            width: 100%;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(2px);
            border-radius: 64px;
            padding: 20px 24px 30px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .wheel-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        .wheel-panel {
            flex: 2;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls-panel {
            flex: 1.2;
            min-width: 280px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 24px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,215,0,0.3);
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
        }

        canvas {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #2d2a2e;
            border-radius: 50%;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), 0 0 0 8px #f9e0a0, 0 0 0 12px #b87c2e;
            transition: all 0.2s;
            cursor: pointer;
        }

        canvas:active {
            transform: scale(0.98);
        }

        .pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 28px solid transparent;
            border-right: 28px solid transparent;
            border-top: 55px solid #ffd966;
            filter: drop-shadow(0 5px 6px rgba(0,0,0,0.4));
            z-index: 10;
        }
        .pointer::after {
            content: "▼";
            position: absolute;
            top: -58px;
            left: -18px;
            font-size: 28px;
            color: #b45309;
            text-shadow: 0 2px 3px black;
        }

        .main-controls {
            display: flex;
            gap: 15px;
            margin: 20px 0 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #ffbe3c;
            border: none;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.15s linear;
            font-family: inherit;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            color: #2c1e0f;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-spin {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            box-shadow: 0 0 15px #f39c12;
            flex: 1;
        }

        .btn-reset {
            background: #2c3e50;
            color: #ecf0f1;
        }

        .btn-admin {
            background: #7f8c8d;
            color: white;
            padding: 8px 16px;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .names-editor {
            margin-top: 10px;
        }

        .names-editor h3 {
            color: #ffdd99;
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            border-left: 6px solid #f39c12;
            padding-left: 15px;
        }

        .name-list {
            background: #1e2a32;
            border-radius: 36px;
            padding: 16px;
            max-height: 280px;
            overflow-y: auto;
        }

        .name-item {
            background: #0f212e;
            margin: 8px 0;
            padding: 8px 14px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: 500;
            border: 1px solid #ffb347;
            gap: 10px;
        }

        .name-text {
            word-break: break-word;
            flex: 1;
            font-size: 1rem;
        }

        .remove-name {
            background: #c0392b;
            border: none;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
            box-shadow: none;
        }

        .add-name-form {
            display: flex;
            margin-top: 15px;
            gap: 10px;
        }

        .add-name-form input {
            flex: 2;
            padding: 12px 15px;
            border-radius: 50px;
            border: none;
            background: #fef5e7;
            font-size: 1rem;
            outline: none;
        }

        .slider-group {
            margin: 20px 0;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            color: #ffe0b5;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #f39c12;
        }

        .selected-winner {
            background: #2c3e2fd9;
            border-radius: 40px;
            padding: 12px;
            margin: 20px 0;
            text-align: center;
            border-left: 8px solid gold;
            backdrop-filter: blur(4px);
        }

        .winner-badge {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffd966;
        }

        /* Panel Admin - Tersembunyi secara default */
        .admin-panel {
            background: #000000aa;
            border-radius: 36px;
            padding: 16px;
            margin-top: 15px;
            border: 1px solid #f39c1244;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .admin-panel.hidden {
            display: none;
        }

        .admin-title {
            color: #f9e0a0;
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .admin-title span {
            cursor: pointer;
            background: #34495e;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
        }

        .quick-select-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 60px;
            background: #fcf3da;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            cursor: pointer;
        }

        .force-win-btn {
            background: #9b59b6;
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
        }

        .info-status {
            font-size: 0.85rem;
            background: #00000066;
            padding: 8px;
            border-radius: 80px;
            text-align: center;
            color: #ffd966;
            margin-top: 12px;
        }

        .sound-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .sound-toggle button {
            background: #34495e;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .toggle-admin-btn {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 6px 12px;
            font-size: 0.75rem;
            margin-top: 5px;
        }

        @media (max-width: 780px) {
            .app-container {
                padding: 15px;
            }
            button {
                padding: 10px 18px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="wheel-layout">
        <!-- Kiri: Roda Putar -->
        <div class="wheel-panel">
            <div class="canvas-wrapper">
                <canvas id="wheelCanvas" width="600" height="600"></canvas>
                <div class="pointer"></div>
            </div>
            <div class="main-controls">
                <button id="spinBtn" class="btn-spin">🎡 PUTAR RODA 🎡</button>
                <button id="resetSpinBtn" class="btn-reset">⟳ Reset</button>
            </div>
            <div class="slider-group">
                <label>⏱️ Durasi Putaran (detik): <span id="durationValue">2.5</span>s</label>
                <input type="range" id="spinDuration" min="0.8" max="5" step="0.1" value="2.5">
            </div>
            <div class="sound-toggle">
                <span style="color:#ffd966;">🔊 Suara:</span>
                <button id="toggleSoundBtn" style="background:#f39c12;">🔊 AKTIF</button>
            </div>
            <div class="info-status">
                💡 Klik roda atau tombol PUTAR untuk memutar roda secara acak!
            </div>
        </div>

        <!-- Kanan: Daftar Peserta + Panel Admin Tersembunyi -->
        <div class="controls-panel">
            <div class="names-editor">
                <h3>📝 Daftar Peserta</h3>
                <div id="nameListContainer" class="name-list">
                    <!-- daftar nama dinamis -->
                </div>
                <div class="add-name-form">
                    <input type="text" id="newNameInput" placeholder="Nama peserta (contoh: Andi)" maxlength="25">
                    <button id="addNameBtn" style="background:#27ae60;">+ Tambah</button>
                </div>
            </div>

            <div class="selected-winner">
                🏆 <span style="font-size:0.9rem;">PEMENANG SAAT INI</span><br>
                <span class="winner-badge" id="winnerName">---</span>
            </div>

            <!-- Tombol untuk menampilkan panel admin -->
            <button id="showAdminBtn" class="toggle-admin-btn">🔧 Admin (Atur Pemenang)</button>

            <!-- Panel Admin - Tersembunyi -->
            <div id="adminPanel" class="admin-panel hidden">
                <div class="admin-title">
                    🎯 ATUR PEMENANG
                    <span id="hideAdminBtn" style="cursor:pointer;">✖ Tutup</span>
                </div>
                <div class="quick-select-group">
                    <select id="forceWinnerSelect">
                        <option value="">-- Pilih peserta --</option>
                    </select>
                    <button id="forceWinnerBtn" class="force-win-btn">✨ Putar & Tetapkan Pemenang</button>
                    <div class="info-status" style="margin-top: 8px;">
                        ⚡ Roda akan berputar dan berhenti tepat di peserta pilihan Anda.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- DATA ----------
        let items = [];         // array of { name: string, color: string }
        let colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF9F1C', '#BF9ACA', '#6C91B2', '#E85D75', '#2F9E68', '#F4A261', '#9C89B8', '#F9C74F', '#577590', '#F9844A', '#43AA8B', '#D00000'];
        
        // State animasi
        let currentRotation = 0;      // radian
        let animating = false;
        let animationFrame = null;
        let spinStartTime = 0;
        let spinDurationMs = 2500;
        let spinStartRot = 0;
        let spinTargetDelta = 0;
        
        // Suara
        let audioContext = null;
        let soundEnabled = true;
        let spinSoundInterval = null;
        
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let width = 600, height = 600;
        
        // DOM elements
        const nameListContainer = document.getElementById('nameListContainer');
        const newNameInput = document.getElementById('newNameInput');
        const addNameBtn = document.getElementById('addNameBtn');
        const spinBtn = document.getElementById('spinBtn');
        const resetSpinBtn = document.getElementById('resetSpinBtn');
        const spinDurationSlider = document.getElementById('spinDuration');
        const durationValue = document.getElementById('durationValue');
        const winnerNameSpan = document.getElementById('winnerName');
        const forceWinnerSelect = document.getElementById('forceWinnerSelect');
        const forceWinnerBtn = document.getElementById('forceWinnerBtn');
        const toggleSoundBtn = document.getElementById('toggleSoundBtn');
        const adminPanel = document.getElementById('adminPanel');
        const showAdminBtn = document.getElementById('showAdminBtn');
        const hideAdminBtn = document.getElementById('hideAdminBtn');
        
        // Inisialisasi AudioContext
        function initAudio() {
            if (!audioContext && soundEnabled) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) { console.log("Web Audio API tidak didukung"); soundEnabled = false; }
            }
        }
        
        // Memainkan suara "klik" saat putaran
        function playSpinSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioContext) return;
            try {
                const now = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 800 + Math.random() * 200;
                gain.gain.value = 0.08;
                osc.type = 'sine';
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.08);
                osc.stop(now + 0.08);
            } catch(e) { /* silent fail */ }
        }
        
        // Loop suara saat berputar
        function startSpinSoundLoop() {
            if (!soundEnabled) return;
            if (spinSoundInterval) clearInterval(spinSoundInterval);
            playSpinSound();
            spinSoundInterval = setInterval(() => {
                if (animating && soundEnabled) {
                    playSpinSound();
                } else if (!animating) {
                    stopSpinSoundLoop();
                }
            }, 130);
        }
        
        function stopSpinSoundLoop() {
            if (spinSoundInterval) {
                clearInterval(spinSoundInterval);
                spinSoundInterval = null;
            }
        }
        
        // Suara "ding" selesai
        function playWinnerSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioContext) return;
            try {
                const now = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 880;
                gain.gain.value = 0.15;
                osc.type = 'triangle';
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.5);
                osc.stop(now + 0.5);
                const osc2 = audioContext.createOscillator();
                const gain2 = audioContext.createGain();
                osc2.connect(gain2);
                gain2.connect(audioContext.destination);
                osc2.frequency.value = 440;
                gain2.gain.value = 0.1;
                osc2.type = 'sine';
                osc2.start();
                gain2.gain.exponentialRampToValueAtTime(0.00001, now + 0.4);
                osc2.stop(now + 0.4);
            } catch(e) {}
        }
        
        // Update UI
        function updateAllUI() {
            renderNameList();
            updateForceSelect();
            updateWinnerText();
        }
        
        // Render daftar peserta (hanya nama dan tombol hapus)
        function renderNameList() {
            nameListContainer.innerHTML = '';
            if(items.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'name-item';
                emptyDiv.innerHTML = '<span class="name-text" style="color:#aaa;">✨ Belum ada peserta, tambahkan nama di atas</span>';
                nameListContainer.appendChild(emptyDiv);
                return;
            }
            
            items.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'name-item';
                div.innerHTML = `
                    <span class="name-text" style="background:${item.color}30; padding:4px 12px; border-radius:32px;">${escapeHtml(item.name)}</span>
                    <button class="remove-name" data-index="${idx}">✖</button>
                `;
                nameListContainer.appendChild(div);
            });
            
            document.querySelectorAll('.remove-name').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(btn.getAttribute('data-index'));
                    if(!isNaN(idx) && idx >= 0 && idx < items.length){
                        items.splice(idx,1);
                        if(items.length === 0) winnerNameSpan.innerText = '---';
                        assignColorsToItems(); 
                        drawWheel();
                        updateAllUI();
                    }
                    e.stopPropagation();
                });
            });
        }
        
        // Update dropdown pemenang
        function updateForceSelect() {
            forceWinnerSelect.innerHTML = '<option value="">-- Pilih peserta (atur pemenang) --</option>';
            items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.name;
                opt.innerText = item.name;
                forceWinnerSelect.appendChild(opt);
            });
        }
        
        function assignColorsToItems() {
            for(let i=0; i<items.length; i++) {
                if(!items[i].color) items[i].color = colors[i % colors.length];
                else items[i].color = colors[i % colors.length];
            }
        }
        
        // Gambar roda
        function drawWheel() {
            if(!canvas || items.length === 0) {
                ctx.clearRect(0,0,width,height);
                ctx.save();
                ctx.beginPath();
                ctx.arc(width/2, height/2, width/2, 0, 2*Math.PI);
                ctx.fillStyle = '#3c2e2a';
                ctx.fill();
                ctx.strokeStyle = '#e0b354';
                ctx.lineWidth = 8;
                ctx.stroke();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 20px "Segoe UI"';
                ctx.fillText("🎲", width/2-15, height/2+8);
                ctx.restore();
                return;
            }
            
            const angleStep = (Math.PI * 2) / items.length;
            const radRotation = currentRotation;
            const centerX = width/2;
            const centerY = height/2;
            const radius = width/2;
            
            ctx.clearRect(0, 0, width, height);
            
            for(let i = 0; i < items.length; i++) {
                const start = i * angleStep + radRotation;
                const end = (i+1) * angleStep + radRotation;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, start, end);
                ctx.closePath();
                ctx.fillStyle = items[i].color;
                ctx.fill();
                ctx.save();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.restore();
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(start + angleStep/2);
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const textRadius = radius * 0.68;
                let nama = items[i].name;
                if(nama.length > 15) nama = nama.slice(0,12)+'..';
                const fontSize = Math.min(24, Math.floor(38 / Math.max(1, items.length/4.5)));
                ctx.font = `bold ${fontSize}px "Segoe UI", "Poppins"`;
                ctx.fillStyle = '#1f1a17';
                ctx.shadowBlur = 0;
                ctx.fillText(nama, textRadius, 6);
                ctx.fillStyle = '#FFF8E7';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.fillText(nama, textRadius-1, 5);
                ctx.restore();
            }
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius*0.1, 0, 2*Math.PI);
            ctx.fillStyle = '#f7d44a';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius*0.06, 0, 2*Math.PI);
            ctx.fillStyle = '#b76e2e';
            ctx.fill();
        }
        
        function getWinnerIndex() {
            if(items.length === 0) return -1;
            const angleStep = (Math.PI * 2) / items.length;
            const pointerAngle = -Math.PI/2;
            for(let i=0; i<items.length; i++) {
                let start = i * angleStep + currentRotation;
                let end = (i+1) * angleStep + currentRotation;
                let pointerNorm = pointerAngle;
                let startNorm = ((start % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
                let endNorm = ((end % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
                if(pointerNorm < 0) pointerNorm += 2*Math.PI;
                if(startNorm < endNorm) {
                    if(pointerNorm >= startNorm && pointerNorm < endNorm) return i;
                } else {
                    if(pointerNorm >= startNorm || pointerNorm < endNorm) return i;
                }
            }
            return 0;
        }
        
        function updateWinnerText() {
            if(items.length === 0) {
                winnerNameSpan.innerText = "---";
                return;
            }
            const idx = getWinnerIndex();
            if(idx !== -1 && items[idx]) winnerNameSpan.innerText = items[idx].name;
            else winnerNameSpan.innerText = "???";
        }
        
        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }
        
        function animateSpin(now) {
            const elapsed = now - spinStartTime;
            let t = Math.min(1, elapsed / spinDurationMs);
            const easeT = easeOutCubic(t);
            const newRot = spinStartRot + spinTargetDelta * easeT;
            currentRotation = newRot % (Math.PI * 2);
            drawWheel();
            updateWinnerText();
            
            if(t < 1) {
                animationFrame = requestAnimationFrame(animateSpin);
            } else {
                currentRotation = (spinStartRot + spinTargetDelta) % (Math.PI * 2);
                drawWheel();
                updateWinnerText();
                animating = false;
                animationFrame = null;
                stopSpinSoundLoop();
                playWinnerSound();
            }
        }
        
        // Fungsi utama: putar roda ke target pemenang
        function spinToWinnerWithAnimation(winnerName) {
            if(items.length === 0) {
                alert("Belum ada peserta. Tambahkan nama dulu.");
                return;
            }
            const targetIndex = items.findIndex(item => item.name === winnerName);
            if(targetIndex === -1) {
                alert(`Peserta "${winnerName}" tidak ditemukan.`);
                return;
            }
            
            if(animating) {
                cancelAnimation();
            }
            
            const angleStep = (Math.PI * 2) / items.length;
            const targetCenterAngle = (targetIndex * angleStep) + (angleStep/2);
            let targetRotation = (-Math.PI/2) - targetCenterAngle;
            targetRotation = ((targetRotation % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
            let currentRotNorm = ((currentRotation % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
            let delta = targetRotation - currentRotNorm;
            const extraSpins = 4 + Math.floor(Math.random() * 4);
            const extraAngle = extraSpins * 2 * Math.PI;
            if(delta <= 0) delta += 2 * Math.PI;
            delta += extraAngle;
            
            spinStartRot = currentRotation;
            spinTargetDelta = delta;
            spinDurationMs = parseFloat(spinDurationSlider.value) * 1000;
            spinStartTime = performance.now();
            animating = true;
            
            if(animationFrame) cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(animateSpin);
            startSpinSoundLoop();
        }
        
        // Putar random
        function startRandomSpin() {
            if(animating) cancelAnimation();
            if(items.length === 0) {
                alert("Tambahkan minimal 1 peserta!");
                return false;
            }
            const minSpins = 5, maxSpins = 12;
            const spins = minSpins + Math.random() * (maxSpins - minSpins);
            const randomRadOffset = Math.random() * Math.PI * 2;
            const finalDelta = spins * 2 * Math.PI + randomRadOffset;
            spinStartRot = currentRotation;
            spinTargetDelta = finalDelta;
            spinDurationMs = parseFloat(spinDurationSlider.value) * 1000;
            spinStartTime = performance.now();
            animating = true;
            if(animationFrame) cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(animateSpin);
            startSpinSoundLoop();
            return true;
        }
        
        function cancelAnimation() {
            if(animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            animating = false;
            stopSpinSoundLoop();
            drawWheel();
            updateWinnerText();
        }
        
        function hardResetSpin() {
            if(animating) cancelAnimation();
            drawWheel();
            updateWinnerText();
        }
        
        function addName() {
            let rawName = newNameInput.value.trim();
            if(rawName === "") {
                alert("Nama tidak boleh kosong");
                return;
            }
            if(rawName.length > 25) rawName = rawName.slice(0,25);
            if(items.some(item => item.name === rawName)) {
                alert("Nama sudah ada dalam daftar!");
                return;
            }
            items.push({ name: rawName, color: '' });
            assignColorsToItems();
            drawWheel();
            updateAllUI();
            newNameInput.value = '';
            newNameInput.focus();
        }
        
        function initDefaultNames() {
            if(items.length === 0) {
                items = [
                    { name: "Ayu", color: "" }, { name: "Budi", color: "" },
                    { name: "Citra", color: "" }, { name: "Dewi", color: "" },
                    { name: "Eko", color: "" }, { name: "Fajar", color: "" }
                ];
                assignColorsToItems();
                drawWheel();
                updateAllUI();
            }
        }
        
        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&<>]/g, function(m){
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                return '&gt;';
            });
        }
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            const size = Math.min(container.clientWidth, 550);
            canvas.width = size;
            canvas.height = size;
            width = size;
            height = size;
            drawWheel();
        }
        
        // Toggle suara
        toggleSoundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            toggleSoundBtn.textContent = soundEnabled ? "🔊 AKTIF" : "🔇 NONAKTIF";
            toggleSoundBtn.style.background = soundEnabled ? "#f39c12" : "#7f8c8d";
            if(!soundEnabled) stopSpinSoundLoop();
            else if(animating) startSpinSoundLoop();
        });
        
        // Toggle Admin Panel
        showAdminBtn.addEventListener('click', () => {
            adminPanel.classList.remove('hidden');
        });
        
        hideAdminBtn.addEventListener('click', () => {
            adminPanel.classList.add('hidden');
        });
        
        // Event listeners
        spinBtn.addEventListener('click', () => {
            if(items.length === 0) alert("Tambahkan peserta dulu!");
            else startRandomSpin();
        });
        
        resetSpinBtn.addEventListener('click', () => hardResetSpin());
        
        spinDurationSlider.addEventListener('input', (e) => {
            durationValue.innerText = parseFloat(e.target.value).toFixed(1);
        });
        
        forceWinnerBtn.addEventListener('click', () => {
            const selected = forceWinnerSelect.value;
            if(!selected || selected === "") {
                alert("Pilih peserta dari dropdown untuk ditetapkan sebagai pemenang");
                return;
            }
            spinToWinnerWithAnimation(selected);
            adminPanel.classList.add('hidden'); // otomatis tutup setelah pilih
        });
        
        addNameBtn.addEventListener('click', addName);
        newNameInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') addName(); });
        
        canvas.addEventListener('click', () => {
            if(items.length > 0) startRandomSpin();
            else alert("Tambah peserta terlebih dahulu");
        });
        
        window.addEventListener('resize', () => resizeCanvas());
        resizeCanvas();
        initDefaultNames();
        
        // Inisialisasi audio saat interaksi pertama
        document.body.addEventListener('click', () => {
            if(audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }, { once: true });
    })();
</script>
</body>
</html>
